name: Deploy dev

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  LEFTHOOK: 0
  VITE_API_URL: https://api-dev.coursary.joaodevdude.com

jobs:
  branch:
    runs-on: ubuntu-latest
    steps:
      - if: github.ref != 'refs/heads/develop'
        run: |
          echo "::error::Deploy dev roda só a partir da develop: escolha develop em 'Use workflow from'."
          exit 1

  check:
    needs: branch
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: dev
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      # No package cache in the job that holds the deploy role: a poisoned cache would run with it.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate:env
      - run: pnpm build
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: sa-east-1
      # Hashed files first and never deleted, so a tab on the previous version still finds its own;
      # index.html last, then only it is invalidated.
      - name: Upload the build
        run: |
          test -f build/client/index.html && test -d build/client/assets
          bucket=$(aws ssm get-parameter --name /coursary-api/dev/site/bucket --query Parameter.Value --output text)
          distribution=$(aws ssm get-parameter --name /coursary-api/dev/site/distribution-id --query Parameter.Value --output text)
          aws s3 sync build/client/assets "s3://$bucket/assets" --cache-control 'public, max-age=31536000, immutable'
          aws s3 sync build/client "s3://$bucket" --exclude 'assets/*' --exclude index.html --cache-control no-cache --delete
          aws s3 cp build/client/index.html "s3://$bucket/index.html" --cache-control no-cache
          invalidation=$(aws cloudfront create-invalidation --distribution-id "$distribution" --paths /index.html --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$distribution" --id "$invalidation"
