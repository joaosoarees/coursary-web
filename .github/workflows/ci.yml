name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # A run takes about a minute; a stuck one stops here, not at GitHub's 6 hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          VITE_API_URL: https://api-dev.coursary.joaodevdude.com

  # The build goes to the site's bucket in the API stack; the role may only do this (Q492, Q495).
  deploy-dev:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: dev
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      # No package cache in the job that holds the deploy role: a poisoned cache would run with it.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          VITE_API_URL: https://api-dev.coursary.joaodevdude.com
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: sa-east-1
      # Hashed files first and never deleted, so a tab on the previous version still finds its own;
      # index.html last, then only it is invalidated (Q475, Q495).
      - name: Upload the build
        run: |
          bucket=$(aws ssm get-parameter --name /coursary-api/dev/site/bucket --query Parameter.Value --output text)
          distribution=$(aws ssm get-parameter --name /coursary-api/dev/site/distribution-id --query Parameter.Value --output text)
          aws s3 sync build/client/assets "s3://$bucket/assets" --cache-control 'public, max-age=31536000, immutable'
          aws s3 sync build/client "s3://$bucket" --exclude 'assets/*' --exclude index.html --cache-control no-cache
          aws s3 cp build/client/index.html "s3://$bucket/index.html" --cache-control no-cache
          aws cloudfront create-invalidation --distribution-id "$distribution" --paths /index.html
